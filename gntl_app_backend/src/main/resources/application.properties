spring.datasource.url=jdbc:postgresql://localhost:5432/gentleman_store
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=2592000000

logging.level.org.springframework.security=DEBUG

# Comma-separated list of allowed CORS origins (e.g. https://admin.gentlemanstore.com). Empty by default.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.devtools.restart.enabled=false

spring.data.web.pageable.serialization-mode=via_dto